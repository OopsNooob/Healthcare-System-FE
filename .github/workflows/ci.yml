name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.x"
  PNPM_VERSION: "10.20.0"

jobs:
  quality:
    name: Lint & Typecheck (Admin, Client & Mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint (Admin)
        run: pnpm --filter admin lint

      - name: Run TypeScript Typecheck (Admin)
        run: pnpm --filter admin typecheck

      - name: Run ESLint (Client)
        run: pnpm --filter client lint

      - name: Run TypeScript Typecheck (Client)
        run: pnpm --filter client typecheck

      - name: Run TypeScript Typecheck (Mobile)
        run: pnpm --filter mobile typecheck

